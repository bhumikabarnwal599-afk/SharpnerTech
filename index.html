<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sugar & Stock — Candy Shop Seller Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --ink: #2E1A3C;
    --ink-soft: #6B5876;
    --paper: #FFF8F0;
    --paper-raised: #FFFFFF;
    --lilac: #F3E8FF;
    --raspberry: #E63969;
    --raspberry-dark: #C22651;
    --mint: #2FB6A8;
    --mint-soft: #DFF6F3;
    --butter: #FFC857;
    --line: #EDE1F0;
    --shadow: 0 1px 2px rgba(46,26,60,0.06), 0 8px 20px rgba(46,26,60,0.06);
    --danger: #D64545;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #F3EAF7;
      --ink-soft: #C6B4D1;
      --paper: #1B1220;
      --paper-raised: #241830;
      --lilac: #2C1E38;
      --line: #3A2A46;
      --mint-soft: #16302E;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --ink: #F3EAF7;
    --ink-soft: #C6B4D1;
    --paper: #1B1220;
    --paper-raised: #241830;
    --lilac: #2C1E38;
    --line: #3A2A46;
    --mint-soft: #16302E;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display {
    font-family: 'Baloo 2', 'Inter', sans-serif;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: linear-gradient(135deg, var(--raspberry) 0%, var(--raspberry-dark) 100%);
    color: #FFF3EA;
    padding: 18px clamp(16px, 4vw, 40px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .mark {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--butter);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
  }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.2px; }
  .brand p { margin: 0; font-size: 12.5px; color: #FFE1D6; font-weight: 500; }

  .till {
    display: flex; align-items: center; gap: 22px;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.22);
    padding: 10px 18px;
    border-radius: 14px;
  }
  .till .stat { text-align: right; }
  .till .stat .num { font-family: 'Baloo 2'; font-size: 19px; font-weight: 700; line-height: 1; }
  .till .stat .lbl { font-size: 11px; color: #FFE1D6; margin-top: 3px; }
  .till .divider { width: 1px; height: 30px; background: rgba(255,255,255,0.3); }

  /* ---------- Layout ---------- */
  .layout {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(16px, 3vw, 32px);
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ---------- Form panel ---------- */
  .panel {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    box-shadow: var(--shadow);
    position: sticky;
    top: calc(92px + env(safe-area-inset-top, 0px));
  }
  @media (max-width: 820px) { .panel { position: static; } }
  .panel h2 { margin: 0 0 4px; font-size: 19px; }
  .panel .sub { margin: 0 0 16px; font-size: 13px; color: var(--ink-soft); }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 14px 0 6px;
  }
  label:first-of-type { margin-top: 0; }
  input, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  textarea { resize: vertical; min-height: 60px; font-family: inherit; }
  input:focus, textarea:focus {
    border-color: var(--raspberry);
    box-shadow: 0 0 0 3px rgba(230,57,105,0.15);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .add-btn {
    margin-top: 18px;
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 12px;
    padding: 13px 16px;
    font-family: 'Baloo 2';
    font-size: 15.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s ease, opacity .15s ease;
  }
  .add-btn:hover { opacity: 0.88; }
  .add-btn:active { transform: scale(0.98); }
  .add-btn:focus-visible, button:focus-visible, input:focus-visible { outline: 2.5px solid var(--mint); outline-offset: 2px; }

  .field-error { color: var(--danger); font-size: 12px; margin-top: 6px; min-height: 16px; }

  /* ---------- Shelf ---------- */
  .shelf-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px; gap: 10px; flex-wrap: wrap;
  }
  .shelf-head h2 { margin: 0; font-size: 20px; }
  .shelf-head .count { font-size: 13px; color: var(--ink-soft); }

  .empty {
    background: var(--lilac);
    border: 1.5px dashed var(--raspberry);
    border-radius: 16px;
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty .big { font-size: 34px; display: block; margin-bottom: 10px; }
  .empty strong { color: var(--ink); display: block; font-family: 'Baloo 2'; font-size: 17px; margin-bottom: 4px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: var(--stripe, var(--mint));
  }
  .card-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card-name { font-family: 'Baloo 2'; font-size: 17px; font-weight: 700; margin: 0; }
  .card-desc { font-size: 13px; color: var(--ink-soft); margin: 0; line-height: 1.4; }

  .price-tag {
    flex-shrink: 0;
    background: var(--butter);
    color: #4A2E00;
    font-family: 'Baloo 2';
    font-weight: 700;
    font-size: 14px;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .stock-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-soft); }
  .stock-pill {
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 20px;
    background: var(--mint-soft);
    color: var(--mint);
  }
  .stock-pill.low { background: #FDE7E7; color: var(--danger); }
  .stock-pill.out { background: #EDE1F0; color: var(--ink-soft); }

  .buy-row { display: flex; gap: 6px; margin-top: 4px; }
  .buy-btn {
    flex: 1;
    background: var(--raspberry);
    color: #FFF3EA;
    border: none;
    border-radius: 10px;
    padding: 9px 4px;
    font-family: 'Baloo 2';
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    transition: transform .08s ease, background .15s ease;
  }
  .buy-btn:hover:not(:disabled) { background: var(--raspberry-dark); }
  .buy-btn:active:not(:disabled) { transform: scale(0.95); }
  .buy-btn:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }

  .card-manage { display: flex; gap: 6px; margin-top: 2px; }
  .icon-btn {
    flex: 1;
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    border-radius: 9px;
    padding: 6px 4px;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Inter';
    cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--ink-soft); color: var(--ink); }
  .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  .restock-inline { display: none; gap: 6px; margin-top: 4px; }
  .restock-inline.open { display: flex; }
  .restock-inline input {
    width: 60px; padding: 6px 8px; font-size: 13px;
  }
  .restock-inline button {
    background: var(--mint); color: #fff; border: none; border-radius: 8px;
    padding: 6px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }

  .footer-note {
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    padding: 30px 16px 40px;
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }

  [data-anim] { animation: pop .28s ease; }
  @keyframes pop { from { transform: scale(0.94); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    [data-anim] { animation: none; }
    .add-btn, .buy-btn { transition: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">🍬</div>
    <div>
      <h1>Sugar &amp; Stock</h1>
      <p>Candy shop seller dashboard</p>
    </div>
  </div>
  <div class="till">
    <div class="stat">
      <div class="num" id="revenueNum">₹0</div>
      <div class="lbl">Today's till</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="num" id="soldNum">0</div>
      <div class="lbl">Candies sold</div>
    </div>
  </div>
</div>

<div class="layout">
  <div class="panel">
    <h2>Stock the shelf</h2>
    <p class="sub">Add a new candy to sell.</p>

    <label for="cName">Candy name</label>
    <input id="cName" type="text" placeholder="e.g. Eclair" maxlength="40">

    <label for="cDesc">Description</label>
    <textarea id="cDesc" placeholder="e.g. Chewy chocolate toffee"></textarea>

    <div class="row2">
      <div>
        <label for="cPrice">Price (₹)</label>
        <input id="cPrice" type="number" min="0" step="1" placeholder="2">
      </div>
      <div>
        <label for="cQty">Quantity</label>
        <input id="cQty" type="number" min="0" step="1" placeholder="100">
      </div>
    </div>

    <div class="field-error" id="formError"></div>
    <button class="add-btn" id="addBtn">Add item</button>
  </div>

  <div>
    <div class="shelf-head">
      <h2>On the shelf</h2>
      <span class="count" id="itemCount">0 candies</span>
    </div>

    <div id="emptyState" class="empty">
      <span class="big">🍭</span>
      <strong>The shelf is empty</strong>
      Add your first candy on the left to open shop.
    </div>

    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="footer-note">Stock and sales are saved on this device only.</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "candyShop.items.v1";
  var stripes = ["#E63969", "#2FB6A8", "#FFC857", "#9B6BD1", "#4FA8E0"];

  var els = {
    name: document.getElementById("cName"),
    desc: document.getElementById("cDesc"),
    price: document.getElementById("cPrice"),
    qty: document.getElementById("cQty"),
    addBtn: document.getElementById("addBtn"),
    formError: document.getElementById("formError"),
    grid: document.getElementById("grid"),
    empty: document.getElementById("emptyState"),
    itemCount: document.getElementById("itemCount"),
    revenue: document.getElementById("revenueNum"),
    sold: document.getElementById("soldNum")
  };

  var state = {
    items: [],
    revenue: 0,
    sold: 0
  };

  function uid() {
    return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function loadState() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.items)) {
          state.items = parsed.items;
          state.revenue = typeof parsed.revenue === "number" ? parsed.revenue : 0;
          state.sold = typeof parsed.sold === "number" ? parsed.sold : 0;
          return;
        }
      }
    } catch (e) { /* storage unavailable or corrupt — start fresh */ }
    state.items = [
      { id: uid(), name: "Eclair", desc: "Chewy chocolate toffee", price: 2, qty: 40, stripe: stripes[0] },
      { id: uid(), name: "Chocolaty", desc: "Rich milk chocolate bite", price: 5, qty: 25, stripe: stripes[1] },
      { id: uid(), name: "Sour Twist", desc: "Tangy fruit chew", price: 3, qty: 8, stripe: stripes[2] }
    ];
  }

  function saveState() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* ignore — non-critical persistence */ }
  }

  function money(n) {
    return "₹" + Number(n).toLocaleString("en-IN");
  }

  function render() {
    els.revenue.textContent = money(state.revenue);
    els.sold.textContent = state.sold;
    els.itemCount.textContent = state.items.length + (state.items.length === 1 ? " candy" : " candies");
    els.empty.style.display = state.items.length ? "none" : "block";
    els.grid.innerHTML = "";

    state.items.forEach(function (item) {
      var card = document.createElement("div");
      card.className = "card";
      card.style.setProperty("--stripe", item.stripe || "var(--mint)");

      var stockClass = item.qty === 0 ? "out" : (item.qty <= 5 ? "low" : "");
      var stockLabel = item.qty === 0 ? "Sold out" : item.qty + " left";

      card.innerHTML =
        '<div class="card-top">' +
          '<div>' +
            '<p class="card-name"></p>' +
            '<p class="card-desc"></p>' +
          '</div>' +
          '<div class="price-tag"></div>' +
        '</div>' +
        '<div class="stock-row">' +
          '<span class="stock-pill ' + stockClass + '"></span>' +
        '</div>' +
        '<div class="buy-row">' +
          '<button class="buy-btn" data-qty="1">Buy 1</button>' +
          '<button class="buy-btn" data-qty="2">Buy 2</button>' +
          '<button class="buy-btn" data-qty="3">Buy 3</button>' +
        '</div>' +
        '<div class="card-manage">' +
          '<button class="icon-btn" data-action="restock">Restock</button>' +
          '<button class="icon-btn danger" data-action="remove">Remove</button>' +
        '</div>' +
        '<div class="restock-inline">' +
          '<input type="number" min="1" step="1" placeholder="qty">' +
          '<button data-action="confirm-restock">Add</button>' +
        '</div>';

      card.querySelector(".card-name").textContent = item.name;
      card.querySelector(".card-desc").textContent = item.desc || "";
      card.querySelector(".price-tag").textContent = money(item.price);
      card.querySelector(".stock-pill").textContent = stockLabel;

      var buyBtns = card.querySelectorAll(".buy-btn");
      buyBtns.forEach(function (btn) {
        var qtyWanted = parseInt(btn.getAttribute("data-qty"), 10);
        if (item.qty < qtyWanted) btn.disabled = true;
        btn.addEventListener("click", function () {
          sell(item.id, qtyWanted);
        });
      });

      card.querySelector('[data-action="remove"]').addEventListener("click", function () {
        removeItem(item.id);
      });

      var restockWrap = card.querySelector(".restock-inline");
      card.querySelector('[data-action="restock"]').addEventListener("click", function () {
        restockWrap.classList.toggle("open");
      });
      card.querySelector('[data-action="confirm-restock"]').addEventListener("click", function () {
        var input = restockWrap.querySelector("input");
        var amount = parseInt(input.value, 10);
        if (!amount || amount <= 0) { input.focus(); return; }
        restock(item.id, amount);
        restockWrap.classList.remove("open");
        input.value = "";
      });

      els.grid.appendChild(card);
    });
  }

  function sell(id, amount) {
    var item = state.items.find(function (i) { return i.id === id; });
    if (!item || item.qty < amount) return;
    item.qty -= amount;
    state.revenue += item.price * amount;
    state.sold += amount;
    saveState();
    render();
  }

  function restock(id, amount) {
    var item = state.items.find(function (i) { return i.id === id; });
    if (!item) return;
    item.qty += amount;
    saveState();
    render();
  }

  function removeItem(id) {
    state.items = state.items.filter(function (i) { return i.id !== id; });
    saveState();
    render();
  }

  function addItem() {
    var name = els.name.value.trim();
    var desc = els.desc.value.trim();
    var price = parseFloat(els.price.value);
    var qty = parseInt(els.qty.value, 10);

    if (!name) { showFormError("Give the candy a name."); els.name.focus(); return; }
    if (isNaN(price) || price < 0) { showFormError("Enter a valid price."); els.price.focus(); return; }
    if (isNaN(qty) || qty < 0) { showFormError("Enter a valid quantity."); els.qty.focus(); return; }

    var newItem = {
      id: uid(),
      name: name,
      desc: desc,
      price: price,
      qty: qty,
      stripe: stripes[state.items.length % stripes.length]
    };
    state.items.unshift(newItem);
    saveState();
    showFormError("");
    els.name.value = "";
    els.desc.value = "";
    els.price.value = "";
    els.qty.value = "";
    els.name.focus();
    render();

    requestAnimationFrame(function () {
      var firstCard = els.grid.firstElementChild;
      if (firstCard) { firstCard.setAttribute("data-anim", ""); }
    });
  }

  function showFormError(msg) {
    els.formError.textContent = msg;
  }

  els.addBtn.addEventListener("click", addItem);
  [els.name, els.desc, els.price, els.qty].forEach(function (el) {
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && el !== els.desc) addItem();
    });
  });

  loadState();
  render();
})();
</script>
</body>
</html>
