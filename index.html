<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <div class="container mt-5">

        <form id="expenseForm" class="row g-2 align-items-center">

            <div class="col-md-3">
                <label for="expenseAmount" class="form-label">
                    Choose expense amount:
                </label>

                <input
                    type="number"
                    id="expenseAmount"
                    class="form-control"
                    placeholder="Amount"
                    required
                >
            </div>


            <div class="col-md-3">
                <label for="expenseDescription" class="form-label">
                    Choose description:
                </label>

                <input
                    type="text"
                    id="expenseDescription"
                    class="form-control"
                    placeholder="Description"
                    required
                >
            </div>

            <div class="col-md-3">
                <label for="expenseCategory" class="form-label">
                    Choose a category:
                </label>

                <select
                    id="expenseCategory"
                    class="form-select"
                    required
                >
                    <option value="">Select Category</option>
                    <option value="Movie">Movie</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                </select>
            </div>


            <div class="col-md-2 mt-md-4">
                <button
                    type="submit"
                    id="submitButton"
                    class="btn btn-primary"
                >
                    Add Expense
                </button>
            </div>

        </form>


        <div class="mt-4">

            <ul id="expenseList" class="list-group">

            </ul>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
